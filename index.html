<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#009999"><title>Inscrever-me para o sorteio | Siemens Energy</title><link rel="stylesheet" href="siemens.css"></head>
<body><header><a href="index.html" class="brand" aria-label="Siemens Energy Sorteio"><span class="brand-name">SIEMENS<span class="energy">ENERGY</span></span><span class="brand-divider"></span><span class="brand-event">SORTEIO</span></a><a href="sorteio.php" class="staff-link">Acesso da equipe</a></header><main><section class="card"><div class="eyebrow">SORTEIO • CORREDORES</div><h1 id="heading">Inscrever-me para o sorteio</h1><p id="intro">Informe o número do peito para participar.</p><form id="signup"><label for="numero">Número do peito</label><input id="numero" name="numero" type="number" min="1" max="3000" required placeholder="01 a 3000"><button>Confirmar inscrição <span aria-hidden="true">→</span></button></form><div id="message" role="status"></div><div class="brand-footer"><span>SIEMENS ENERGY</span></div></section></main>
<script>
const api=(a,data={})=>fetch('api.php?action='+a,{method:a==='status'?'GET':'POST',headers:{'Content-Type':'application/json'},body:a==='status'?undefined:JSON.stringify(data)}).then(async r=>{let x=await r.json();if(!r.ok)throw Error(x.error||'Erro no servidor');return x});
async function check(){try{const x=await api('status');if(x.closed){document.getElementById('heading').textContent='Inscrições finalizadas';document.getElementById('intro').textContent='As inscrições para este sorteio foram encerradas.';document.getElementById('signup').hidden=true}}catch(e){document.getElementById('message').textContent=e.message}}
document.getElementById('signup').addEventListener('submit',async e=>{e.preventDefault();const button=e.target.querySelector('button'),m=document.getElementById('message');button.disabled=true;m.textContent='';try{const x=await api('register',{numero:document.getElementById('numero').value});m.textContent=x.message;e.target.reset()}catch(err){m.textContent=err.message}finally{button.disabled=false}});check();
</script></body></html>
